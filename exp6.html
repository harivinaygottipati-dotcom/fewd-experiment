<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar (Flexbox) -->
  <header class="navbar">
    <div class="logo">ShopVerse</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#products">Products</a></li>
        <li><a href="#">Deals</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="cart-btn">Cart (0)</div>
  </header>

  <!-- Hero / Banner Section (Keyframe Animation & CTA Button) -->
  <section class="hero">
    <div class="hero-content">
      <h1>Discover Ultimate Tech Deals</h1>
      <p>Upgrade your setup with premium electronics at unbeatable prices.</p>
      <button class="cta-btn">Shop Now</button>
    </div>
  </section>

  <!-- Product Section (CSS Grid & Hover Effects) -->
  <section id="products" class="products-section">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <div class="product-img">🎧</div>
        <h3>Wireless Headphones</h3>
        <p class="price">$199.99</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>

      <div class="product-card">
        <div class="product-img">⌚</div>
        <h3>Smart Watch</h3>
        <p class="price">$149.99</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>

      <div class="product-card">
        <div class="product-img">💻</div>
        <h3>Pro Laptop</h3>
        <p class="price">$999.99</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>

      <div class="product-card">
        <div class="product-img">📱</div>
        <h3>Smartphone</h3>
        <p class="price">$699.99</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
