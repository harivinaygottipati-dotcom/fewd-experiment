<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admission Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Student Admission Form</h2>
    <form class="admission-form">
      
      <div class="form-group full-width">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="+1234567890" required>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="course">Course Applied For</label>
        <select id="course" required>
          <option value="">Select Course</option>
          <option value="cs">Computer Science & Engineering</option>
          <option value="se">Software Engineering</option>
          <option value="ai">Artificial Intelligence</option>
          <option value="ds">Data Science</option>
        </select>
      </div>

      <div class="form-group">
        <label for="qualification">Highest Qualification</label>
        <input type="text" id="qualification" placeholder="e.g. High School Diploma" required>
      </div>

      <div class="form-group full-width">
        <label for="address">Address</label>
        <textarea id="address" rows="3" placeholder="Enter full address" required></textarea>
      </div>

      <div class="form-group full-width">
        <button type="submit" class="submit-btn">Submit Application</button>
      </div>

    </form>
  </div>

</body>
</html>
