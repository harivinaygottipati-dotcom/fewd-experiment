<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <h1>Weather Dashboard</h1>
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-btn">Search</button>
        </div>
        <div id="error-message" class="error"></div>
        <div id="weather-display" class="weather-info hidden">
            <h2 id="city-name">City</h2>
            <img id="weather-icon" src="" alt="Weather Icon">
            <p id="description">Condition</p>
            <div class="details">
                <p>Temp: <span id="temperature">0</span>°C</p>
                <p>Humidity: <span id="humidity">0</span>%</p>
                <p>Wind: <span id="wind-speed">0</span> km/h</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
